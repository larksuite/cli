          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Validate npm state and publish verified GitHub Release
        id: publish
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release-id }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
          const childProcess = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { evaluateNpmState, verifyCandidateManifest } = require("./scripts/release-candidate");
          const env = process.env;
          const sourceSha = (env.SOURCE_SHA || "").toLowerCase();
          const expectedPrerelease = env.PRERELEASE === "true";
