          }
          function npmView(args, absentAllowed) {
            const result = childProcess.spawnSync("npm", ["view", ...args, "--json"], { encoding: "utf8" });
            if (result.status === 0) { try { return { present: true, value: JSON.parse(result.stdout) }; } catch { throw new Error("npm view returned malformed JSON"); } }
