            return release;
          }
          async function verifyRelease(expectedDraft) {
            await resolveTag();
            const release = assertRelease(await api(`/releases/${releaseID}`), expectedDraft);
            const manifest = JSON.parse(fs.readFileSync("release-candidate/candidate-manifest.json", "utf8"));
            const expected = manifest.releaseAssets?.map((asset) => asset.name).sort();
            const actual = release.assets.map((asset) => asset?.name).sort();
            if (!Array.isArray(expected) || expected.length !== actual.length || expected.some((name, index) => name !== actual[index])) throw new Error("release assets do not exactly match candidate manifest");
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), "lark-cli-public-release-"));
            try {
              for (const asset of release.assets) {
                if (!Number.isSafeInteger(asset?.id) || asset.id <= 0 || !Number.isSafeInteger(asset.size) || asset.size <= 0 || asset.state !== "uploaded" || typeof asset.name !== "string" || path.basename(asset.name) !== asset.name) throw new Error("release asset metadata is invalid");
                const downloaded = await request(`${apiRoot}/releases/assets/${asset.id}`, { headers: { Accept: "application/octet-stream" } });
                if (downloaded.bytes.length !== asset.size) throw new Error(`release asset size changed: ${asset.name}`);
                fs.writeFileSync(path.join(directory, asset.name), downloaded.bytes, { flag: "wx", mode: 0o600 });
              }
