name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      version: ${{ steps.validate.outputs.version }}
      channel: ${{ steps.validate.outputs.channel }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'

      - name: Validate protected release tag
        id: validate
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$REPOSITORY" != "larksuite/cli" ]]; then
            echo "Release tags are accepted only from larksuite/cli." >&2
            exit 1
          fi
          if [[ "$REF_PROTECTED" != "true" ]]; then
            echo "Release tag ${TAG} must be protected by a repository ruleset." >&2
            exit 1
          fi

          preflight_file="${RUNNER_TEMP}/release-preflight.json"
          node scripts/release-preflight.js --tag "$TAG" > "$preflight_file"

          git fetch --no-tags origin main
          HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          MAIN_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Tag ${TAG} does not resolve to the checked-out HEAD commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" "$MAIN_SHA"; then
            echo "Tag ${TAG} does not point to a commit contained in origin/main." >&2
            exit 1
          fi

          node - "$preflight_file" "$HEAD_SHA" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [preflightFile, sourceSha, outputFile] = process.argv.slice(2);
          const result = JSON.parse(fs.readFileSync(preflightFile, "utf8"));
          if (
            result?.ok !== true
            || typeof result.data?.tagVersion !== "string"
            || !["stable", "beta"].includes(result.data?.releaseChannel)
          ) {
            throw new Error("release-preflight.js returned an invalid success payload");
          }
          const channel = result.data.releaseChannel;
          fs.appendFileSync(
            outputFile,
            [
              `source_sha=${sourceSha}`,
              `version=${result.data.tagVersion}`,
              `channel=${channel}`,
              `prerelease=${channel === "beta"}`,
              "",
            ].join("\n"),
          );
          NODE

  build-sign-notarize:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload_candidate.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.candidate_metadata.outputs.manifest-sha256 }}
      artifact-name: ${{ steps.candidate_metadata.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Prepare Apple notarization key
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          for name in \
            MACOS_SIGN_P12 \
            MACOS_SIGN_PASSWORD \
            MACOS_NOTARY_KEY \
            MACOS_TEAM_ID \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required Apple release input ${name} is not configured." >&2
              exit 1
            fi
          done

          umask 077
          notary_key="$(mktemp "${RUNNER_TEMP}/macos-notary-key.XXXXXX")"
          cleanup() {
            rm -f -- "$notary_key"
          }
          trap cleanup EXIT
          printf '%s' "$MACOS_NOTARY_KEY" > "$notary_key"
          chmod 0600 "$notary_key"
          printf 'MACOS_NOTARY_KEY_PATH=%s\n' "$notary_key" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean --skip=publish
        env:
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

      - name: Clean up Apple notarization key
        if: ${{ always() }}
        run: |
          set -euo pipefail
          set +x
          if [[ -n "${MACOS_NOTARY_KEY_PATH:-}" ]]; then
            rm -f -- "$MACOS_NOTARY_KEY_PATH"
            if [[ -e "$MACOS_NOTARY_KEY_PATH" || -L "$MACOS_NOTARY_KEY_PATH" ]]; then
              echo "Apple notarization key cleanup failed." >&2
              exit 1
            fi
          fi
          printf 'MACOS_NOTARY_KEY_PATH=\n' >> "$GITHUB_ENV"

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - name: Build and verify release candidate
        id: candidate_metadata
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          test -s dist/checksums.txt
          (
            cd dist
            sha256sum --check checksums.txt
          )

          shopt -s nullglob
          tarballs=(dist/*.tar.gz)
          zip_archives=(dist/*.zip)
          if (( ${#tarballs[@]} == 0 )); then
            echo "GoReleaser did not produce any .tar.gz archives." >&2
            exit 1
          fi
          if (( ${#zip_archives[@]} == 0 )); then
            echo "GoReleaser did not produce any .zip archives." >&2
            exit 1
          fi

          mkdir release-candidate
          cp "${tarballs[@]}" "${zip_archives[@]}" dist/checksums.txt release-candidate/
          cp dist/checksums.txt checksums.txt
          (
            cd release-candidate
            sha256sum --check checksums.txt
          )

          pack_json="$(npm pack --ignore-scripts --json --pack-destination release-candidate)"
          npm_package="$(
            node - "$pack_json" "$VERSION" <<'NODE'
          const path = require("node:path");
          const [packJson, expectedVersion] = process.argv.slice(2);
          const result = JSON.parse(packJson);
          if (!Array.isArray(result) || result.length !== 1) {
            throw new Error("npm pack must return exactly one package");
          }
          const pack = result[0];
          if (
            pack === null
            || typeof pack !== "object"
            || Array.isArray(pack)
            || pack.name !== "@larksuite/cli"
            || pack.version !== expectedVersion
          ) {
            throw new Error("npm pack returned unexpected package identity or version");
          }
          if (
            typeof pack.filename !== "string"
            || pack.filename.length === 0
            || pack.filename === "."
            || pack.filename === ".."
            || pack.filename.includes("/")
            || pack.filename.includes("\\")
            || path.basename(pack.filename) !== pack.filename
            || !pack.filename.endsWith(".tgz")
          ) {
            throw new Error("npm pack returned an unsafe filename");
          }
          process.stdout.write(pack.filename);
          NODE
          )"
          npm_tgz="release-candidate/${npm_package}"
          node - "$npm_tgz" <<'NODE'
          const fs = require("node:fs");
          const target = process.argv[2];
          const stat = fs.lstatSync(target);
          if (stat.isSymbolicLink() || !stat.isFile() || stat.size === 0) {
            throw new Error("npm pack filename must identify one nonempty regular file");
          }
          NODE

          checksum_entries="$(
            tar -tzf "$npm_tgz" \
              | awk '$0 == "package/checksums.txt" { count++ } END { print count + 0 }'
          )"
          if [[ "$checksum_entries" != "1" ]]; then
            echo "npm package must contain exactly one package/checksums.txt entry." >&2
            exit 1
          fi
          packed_checksums="$(mktemp "${RUNNER_TEMP}/packed-checksums.XXXXXX")"
          cleanup_packed_checksums() {
            rm -f -- "$packed_checksums"
          }
          trap cleanup_packed_checksums EXIT
          tar -xOzf "$npm_tgz" package/checksums.txt > "$packed_checksums"
          if ! cmp --silent checksums.txt "$packed_checksums"; then
            echo "npm package checksums.txt does not match GoReleaser checksums." >&2
            exit 1
          fi
          cleanup_packed_checksums
          trap - EXIT

          node scripts/release-candidate.js create \
            --directory release-candidate \
            --manifest release-candidate/candidate-manifest.json \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --npm-package "$npm_package"
          node scripts/release-candidate.js verify \
            --directory release-candidate \
            --manifest release-candidate/candidate-manifest.json \
            --scope artifact \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --channel "$CHANNEL"

          manifest_sha256="$(sha256sum release-candidate/candidate-manifest.json | cut -d' ' -f1)"
          artifact_name="release-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'manifest-sha256=%s\n' "$manifest_sha256"
            printf 'artifact-name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        id: upload_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate_metadata.outputs.artifact-name }}
          path: release-candidate/
          if-no-files-found: error
          compression-level: 0

  create-draft-release:
    needs:
      - preflight
      - build-sign-notarize
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-sign-notarize.outputs.artifact-id }}
          path: release-candidate
          merge-multiple: true
          digest-mismatch: error

      - name: Validate artifact provenance and release candidate
        env:
          ARTIFACT_DIGEST: ${{ needs.build-sign-notarize.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.build-sign-notarize.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.build-sign-notarize.outputs.artifact-name }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.build-sign-notarize.outputs.manifest-sha256 }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build output artifact-id must be a positive decimal integer." >&2
            exit 1
          fi
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Build output artifact-digest must be one raw SHA-256 digest." >&2
            exit 1
          fi
          if [[ ! "$MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Build output manifest-sha256 must be one raw SHA-256 digest." >&2
            exit 1
          fi

          node <<'NODE'
          (async () => {
          const {
            ARTIFACT_DIGEST,
            ARTIFACT_ID,
            ARTIFACT_NAME,
            GH_TOKEN,
            REPOSITORY,
            RUN_ID,
            SOURCE_SHA,
          } = process.env;

          const fail = (message) => {
            throw new Error(message);
          };
          const response = await fetch(
            `https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${GH_TOKEN}`,
                "User-Agent": "lark-cli-release-workflow",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            },
          );
          const responseText = await response.text();
          if (response.status !== 200) {
            fail(
              `GitHub artifact lookup failed with HTTP ${response.status}: `
              + responseText.slice(0, 500),
            );
          }
          let artifact;
          try {
            artifact = JSON.parse(responseText);
          } catch {
            fail("GitHub artifact lookup returned invalid JSON");
          }
          const expectedID = Number(ARTIFACT_ID);
          if (!Number.isSafeInteger(expectedID) || artifact?.id !== expectedID) {
            fail("GitHub artifact ID does not match the build output");
          }
          if (artifact.name !== ARTIFACT_NAME) {
            fail("GitHub artifact name does not match the build output");
          }
          if (artifact.expired !== false) {
            fail("GitHub release candidate artifact is expired");
          }
          if (String(artifact.workflow_run?.id) !== RUN_ID) {
            fail("GitHub artifact was not produced by the current workflow run");
          }
          if (
            typeof artifact.workflow_run?.head_sha !== "string"
            || artifact.workflow_run.head_sha.toLowerCase() !== SOURCE_SHA.toLowerCase()
          ) {
            fail("GitHub artifact source commit does not match the protected release tag");
          }
          if (
            artifact.digest !== `sha256:${ARTIFACT_DIGEST.toLowerCase()}`
          ) {
            fail("GitHub artifact digest does not match the upload action output");
          }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          observed_manifest_sha256="$(
            sha256sum release-candidate/candidate-manifest.json | awk '{print $1}'
          )"
          if [[ "$observed_manifest_sha256" != "${MANIFEST_SHA256,,}" ]]; then
            echo "Candidate manifest SHA-256 does not match the build output." >&2
            exit 1
          fi

          node scripts/release-candidate.js verify \
            --directory release-candidate \
            --manifest release-candidate/candidate-manifest.json \
            --scope artifact \
            --source-sha "$SOURCE_SHA" \
            --version "$VERSION" \
            --channel "$CHANNEL"

      - name: Create or reuse Draft Release
        id: release
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          (async () => {
          const childProcess = require("node:child_process");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");

          const {
            CHANNEL,
            GH_TOKEN,
            GITHUB_OUTPUT,
            PRERELEASE,
            REPOSITORY,
            SOURCE_SHA,
            TAG,
            VERSION,
          } = process.env;
          const apiRoot = `https://api.github.com/repos/${REPOSITORY}`;
          const expectedPrerelease = PRERELEASE === "true";
          if (PRERELEASE !== "true" && PRERELEASE !== "false") {
            throw new Error("preflight prerelease output must be true or false");
          }
          if (!/^[0-9a-fA-F]{40}$/.test(SOURCE_SHA)) {
            throw new Error("source SHA must be exactly 40 hexadecimal characters");
          }
          const sourceSha = SOURCE_SHA.toLowerCase();
          const manifestPath = path.resolve(
            "release-candidate",
            "candidate-manifest.json",
          );
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (!Array.isArray(manifest.releaseAssets)) {
            throw new Error("candidate manifest releaseAssets must be an array");
          }

          function safeAssetName(name) {
            return (
              typeof name === "string"
              && name.length > 0
              && name !== "."
              && name !== ".."
              && path.basename(name) === name
              && !name.includes("/")
              && !name.includes("\\")
            );
          }

          async function request(url, options, expectedStatuses) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${GH_TOKEN}`,
                "User-Agent": "lark-cli-release-workflow",
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options?.headers || {}),
              },
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!expectedStatuses.includes(response.status)) {
              throw new Error(
                `GitHub API request failed with HTTP ${response.status}: `
                + bytes.toString("utf8", 0, Math.min(bytes.length, 500)),
              );
            }
            return { response, bytes };
          }

          async function api(pathname, options = {}, expectedStatuses = [200]) {
            if (!pathname.startsWith("/")) {
              throw new Error("GitHub API path must start with a slash");
            }
            const result = await request(
              `${apiRoot}${pathname}`,
              options,
              expectedStatuses,
            );
            if (result.bytes.length === 0) return null;
            try {
              return JSON.parse(result.bytes.toString("utf8"));
            } catch {
              throw new Error("GitHub API returned invalid JSON");
            }
          }

          async function resolveRemoteTag() {
            const encodedTag = encodeURIComponent(TAG);
            const ref = await api(`/git/ref/tags/${encodedTag}`);
            if (ref?.ref !== `refs/tags/${TAG}`) {
              throw new Error("GitHub tag lookup did not return the exact release tag");
            }
            let object = ref.object;
            const visited = new Set();
            for (let depth = 0; depth < 8; depth += 1) {
              if (
                object === null
                || typeof object !== "object"
                || !/^[0-9a-fA-F]{40}$/.test(object.sha)
              ) {
                throw new Error("GitHub tag object is malformed");
              }
              const objectSha = object.sha.toLowerCase();
              if (object.type === "commit") {
                if (objectSha !== sourceSha) {
                  throw new Error("Remote release tag does not resolve to the source commit");
                }
                return;
              }
              if (object.type !== "tag" || visited.has(objectSha)) {
                throw new Error("Remote release tag has an invalid object chain");
              }
              visited.add(objectSha);
              const annotated = await api(`/git/tags/${objectSha}`);
              if (depth === 0 && annotated?.tag !== TAG) {
                throw new Error("Annotated tag lookup did not return the exact release tag");
              }
              object = annotated?.object;
            }
            throw new Error("Remote release tag object chain is too deep");
          }

          async function findExactRelease() {
            const matches = [];
            for (let page = 1; page <= 1000; page += 1) {
              const releases = await api(`/releases?per_page=100&page=${page}`);
              if (!Array.isArray(releases)) {
                throw new Error("GitHub releases list is malformed");
              }
              matches.push(...releases.filter((release) => release?.tag_name === TAG));
              if (releases.length < 100) break;
              if (page === 1000) {
                throw new Error("GitHub releases pagination exceeded the safety limit");
              }
            }
            if (matches.length > 1) {
              throw new Error("More than one GitHub Release exists for the exact tag");
            }
            return matches[0] || null;
          }

          function assertRelease(release, expectedID, expectedDraft) {
            if (
              release === null
              || typeof release !== "object"
              || !Number.isSafeInteger(release.id)
              || release.id <= 0
            ) {
              throw new Error("GitHub Release response has an invalid ID");
            }
            if (expectedID !== null && release.id !== expectedID) {
              throw new Error("GitHub Release ID changed during the workflow");
            }
            if (
              release.tag_name !== TAG
              || release.target_commitish?.toLowerCase() !== sourceSha
            ) {
              throw new Error("GitHub Release tag or target commit does not match the source");
            }
            if (
              typeof release.draft !== "boolean"
              || release.draft !== expectedDraft
              || release.prerelease !== expectedPrerelease
            ) {
              throw new Error("GitHub Release draft or prerelease type is inconsistent");
            }
            if (!Array.isArray(release.assets)) {
              throw new Error("GitHub Release assets list is malformed");
            }
            return release;
          }

          async function readExpectedRelease(releaseID, expectedDraft) {
            await resolveRemoteTag();
            const byID = assertRelease(
              await api(`/releases/${releaseID}`),
              releaseID,
              expectedDraft,
            );
            const byTag = await findExactRelease();
            assertRelease(byTag, releaseID, expectedDraft);
            return byID;
          }

          await resolveRemoteTag();
          let release = await findExactRelease();
          let alreadyPublished = false;

          if (release === null) {
            await resolveRemoteTag();
            if (await findExactRelease() !== null) {
              throw new Error("GitHub Release appeared before Draft creation");
            }
            release = assertRelease(
              await api(
                "/releases",
                {
                  method: "POST",
                  body: JSON.stringify({
                    tag_name: TAG,
                    target_commitish: sourceSha,
                    name: TAG,
                    draft: true,
                    prerelease: expectedPrerelease,
                    generate_release_notes: false,
                  }),
                  headers: { "Content-Type": "application/json" },
                },
                [201],
              ),
              null,
              true,
            );
          } else if (release.draft === true) {
            release = assertRelease(release, null, true);
          } else {
            release = assertRelease(release, null, false);
            alreadyPublished = true;
          }

          if (!alreadyPublished) {
            const oldAssets = [...release.assets];
            for (const oldAsset of oldAssets) {
              if (
                !Number.isSafeInteger(oldAsset?.id)
                || oldAsset.id <= 0
                || !safeAssetName(oldAsset.name)
              ) {
                throw new Error("Existing Draft Release contains a malformed asset");
              }
              const current = await readExpectedRelease(release.id, true);
              const currentAsset = current.assets.filter(
                (asset) => asset?.id === oldAsset.id && asset?.name === oldAsset.name,
              );
              if (currentAsset.length !== 1) {
                throw new Error("Draft Release asset changed before deletion");
              }
              await api(
                `/releases/assets/${oldAsset.id}`,
                { method: "DELETE" },
                [204],
              );
            }

            for (const asset of manifest.releaseAssets) {
              if (!safeAssetName(asset?.name)) {
                throw new Error("Candidate manifest contains an unsafe release asset name");
              }
              const target = path.resolve("release-candidate", asset.name);
              const stat = fs.lstatSync(target);
              if (stat.isSymbolicLink() || !stat.isFile() || stat.size === 0) {
                throw new Error(`Release asset ${asset.name} is not a nonempty regular file`);
              }
              const current = await readExpectedRelease(release.id, true);
              if (current.assets.some((remote) => remote?.name === asset.name)) {
                throw new Error(`Draft Release already contains asset ${asset.name}`);
              }
              const uploadURL =
                `https://uploads.github.com/repos/${REPOSITORY}`
                + `/releases/${release.id}/assets?name=${encodeURIComponent(asset.name)}`;
              const uploaded = await request(
                uploadURL,
                {
                  method: "POST",
                  body: fs.readFileSync(target),
                  headers: {
                    Accept: "application/vnd.github+json",
                    "Content-Type": "application/octet-stream",
                  },
                },
                [201],
              );
              let uploadedAsset;
              try {
                uploadedAsset = JSON.parse(uploaded.bytes.toString("utf8"));
              } catch {
                throw new Error("GitHub asset upload returned invalid JSON");
              }
              if (
                !Number.isSafeInteger(uploadedAsset?.id)
                || uploadedAsset.id <= 0
                || uploadedAsset.name !== asset.name
                || uploadedAsset.state !== "uploaded"
                || uploadedAsset.size !== stat.size
              ) {
                throw new Error(`GitHub asset upload response is invalid for ${asset.name}`);
              }
            }
          }

          const expectedDraft = !alreadyPublished;
          const verifiedRelease = await readExpectedRelease(release.id, expectedDraft);
          const expectedNames = manifest.releaseAssets.map((asset) => asset.name).sort();
          const remoteNames = verifiedRelease.assets.map((asset) => asset?.name).sort();
          if (
            remoteNames.length !== expectedNames.length
            || remoteNames.some((name, index) => name !== expectedNames[index])
          ) {
            throw new Error("Remote Release asset names or count do not match the manifest");
          }

          const downloadDirectory = fs.mkdtempSync(
            path.join(os.tmpdir(), "lark-cli-release-assets-"),
          );
          for (const asset of verifiedRelease.assets) {
            if (
              !Number.isSafeInteger(asset?.id)
              || asset.id <= 0
              || !safeAssetName(asset.name)
              || asset.state !== "uploaded"
            ) {
              throw new Error("Remote Release contains a malformed asset");
            }
            const downloaded = await request(
              `${apiRoot}/releases/assets/${asset.id}`,
              { headers: { Accept: "application/octet-stream" } },
              [200],
            );
            if (downloaded.bytes.length !== asset.size) {
              throw new Error(`Downloaded size does not match for ${asset.name}`);
            }
            fs.writeFileSync(
              path.join(downloadDirectory, asset.name),
              downloaded.bytes,
              { flag: "wx", mode: 0o600 },
            );
          }

          childProcess.execFileSync(
            process.execPath,
            [
              "scripts/release-candidate.js",
              "verify",
              "--directory",
              downloadDirectory,
              "--manifest",
              manifestPath,
              "--scope",
              "release",
              "--source-sha",
              sourceSha,
              "--version",
              VERSION,
              "--channel",
              CHANNEL,
            ],
            { stdio: "inherit" },
          );

          fs.appendFileSync(
            GITHUB_OUTPUT,
            `release-id=${release.id}\n`,
          );
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  publish-github:
    needs:
