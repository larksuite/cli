      - name: Install the candidate through the public Release
        env:
          NPM_PACKAGE: ${{ steps.publish.outputs.npm-package }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          npm_tgz="$PWD/release-candidate/$NPM_PACKAGE"
          install_prefix="$(mktemp -d "${RUNNER_TEMP}/lark-cli-global-prefix.XXXXXX")"
          npm_cache="$(mktemp -d "${RUNNER_TEMP}/lark-cli-npm-cache.XXXXXX")"
