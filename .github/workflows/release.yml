            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Draft Release ID must be a positive decimal integer." >&2
            exit 1
          fi

          archive_name="lark-cli-${VERSION}-darwin-${ARCH}.tar.gz"
          download_directory="$(mktemp -d "${RUNNER_TEMP}/macos-release-assets.XXXXXX")"
          extract_directory="$(mktemp -d "${RUNNER_TEMP}/macos-release-extract.XXXXXX")"
          cleanup() {
            rm -rf -- "$download_directory" "$extract_directory"
          }
          trap cleanup EXIT

          node - "$download_directory" "$archive_name" <<'NODE'
          (async () => {
          const fs = require("node:fs");
          const path = require("node:path");

          const [downloadDirectory, archiveName] = process.argv.slice(2);
          const {
            GH_TOKEN,
            PRERELEASE,
            RELEASE_ID,
            REPOSITORY,
            SOURCE_SHA,
            TAG,
          } = process.env;
          const apiRoot = `https://api.github.com/repos/${REPOSITORY}`;
          const expectedPrerelease = PRERELEASE === "true";
          if (PRERELEASE !== "true" && PRERELEASE !== "false") {
            throw new Error("preflight prerelease output must be true or false");
          }
          if (!/^[0-9a-fA-F]{40}$/.test(SOURCE_SHA)) {
            throw new Error("source SHA must be exactly 40 hexadecimal characters");
          }
          const sourceSha = SOURCE_SHA.toLowerCase();
          const releaseID = Number(RELEASE_ID);
          if (!Number.isSafeInteger(releaseID) || releaseID <= 0) {
            throw new Error("Draft Release ID is outside the safe integer range");
          }

          async function request(pathname, accept = "application/vnd.github+json") {
            const response = await fetch(`${apiRoot}${pathname}`, {
              headers: {
                Accept: accept,
                Authorization: `Bearer ${GH_TOKEN}`,
                "User-Agent": "lark-cli-release-workflow",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            if (response.status !== 200) {
              throw new Error(
                `GitHub API request failed with HTTP ${response.status}: `
                + bytes.toString("utf8", 0, Math.min(bytes.length, 500)),
              );
            }
            return bytes;
          }

          async function api(pathname) {
            const bytes = await request(pathname);
            try {
              return JSON.parse(bytes.toString("utf8"));
            } catch {
              throw new Error("GitHub API returned invalid JSON");
            }
          }

          async function resolveRemoteTag() {
            const ref = await api(`/git/ref/tags/${encodeURIComponent(TAG)}`);
            if (ref?.ref !== `refs/tags/${TAG}`) {
              throw new Error("GitHub tag lookup did not return the exact release tag");
            }
            let object = ref.object;
            const visited = new Set();
            for (let depth = 0; depth < 8; depth += 1) {
              if (
                object === null
                || typeof object !== "object"
                || !/^[0-9a-fA-F]{40}$/.test(object.sha)
              ) {
                throw new Error("GitHub tag object is malformed");
              }
              const objectSha = object.sha.toLowerCase();
              if (object.type === "commit") {
                if (objectSha !== sourceSha) {
                  throw new Error("Remote release tag does not resolve to the source commit");
                }
                return;
              }
              if (object.type !== "tag" || visited.has(objectSha)) {
                throw new Error("Remote release tag has an invalid object chain");
              }
              visited.add(objectSha);
              const annotated = await api(`/git/tags/${objectSha}`);
              if (depth === 0 && annotated?.tag !== TAG) {
                throw new Error("Annotated tag lookup did not return the exact release tag");
              }
              object = annotated?.object;
            }
            throw new Error("Remote release tag object chain is too deep");
          }

          await resolveRemoteTag();
          const release = await api(`/releases/${releaseID}`);
          if (
            release?.id !== releaseID
            || release.tag_name !== TAG
            || release.target_commitish?.toLowerCase() !== sourceSha
            || typeof release.draft !== "boolean"
            || release.prerelease !== expectedPrerelease
            || !Array.isArray(release.assets)
          ) {
            throw new Error("Draft or published Release does not match the expected state");
          }

          for (const name of [archiveName, "checksums.txt"]) {
            const matching = release.assets.filter((asset) => asset?.name === name);
            if (matching.length !== 1) {
              throw new Error(`Release must contain exactly one asset named ${name}`);
            }
            const asset = matching[0];
            if (
              !Number.isSafeInteger(asset.id)
              || asset.id <= 0
              || asset.state !== "uploaded"
              || !Number.isSafeInteger(asset.size)
              || asset.size <= 0
            ) {
              throw new Error(`Release asset metadata is invalid for ${name}`);
            }
            const bytes = await request(
              `/releases/assets/${asset.id}`,
              "application/octet-stream",
            );
            if (bytes.length !== asset.size) {
              throw new Error(`Downloaded size does not match for ${name}`);
            }
            fs.writeFileSync(path.join(downloadDirectory, name), bytes, {
              flag: "wx",
              mode: 0o600,
            });
          }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          checksum_matches="${RUNNER_TEMP}/checksum-matches-${ARCH}.txt"
          awk -v expected="$archive_name" '$2 == expected { print }' \
            "$download_directory/checksums.txt" > "$checksum_matches"
          if [[ "$(wc -l < "$checksum_matches" | tr -d '[:space:]')" != "1" ]]; then
            echo "checksums.txt must contain exactly one entry for ${archive_name}." >&2
            exit 1
          fi
          read -r expected_sha checksum_name extra < "$checksum_matches"
          if [[ "$checksum_name" != "$archive_name" || -n "${extra:-}" ]]; then
            echo "The checksum entry for ${archive_name} is malformed." >&2
            exit 1
          fi
          if ! grep -Eq '^[0-9a-fA-F]{64}$' <<<"$expected_sha"; then
            echo "The checksum for ${archive_name} is not a SHA-256 digest." >&2
            exit 1
          fi
          printf '%s  %s\n' "$expected_sha" "$archive_name" \
            > "$download_directory/checksum.single"
          (
            cd "$download_directory"
            shasum -a 256 -c checksum.single
          )

          archive_path="$download_directory/$archive_name"
          binary_entries="$(
            tar -tzf "$archive_path" \
              | awk '$0 == "lark-cli" || $0 == "./lark-cli" { count++ } END { print count + 0 }'
          )"
          if [[ "$binary_entries" != "1" ]]; then
            echo "Archive must contain exactly one root lark-cli entry." >&2
            exit 1
          fi
          tar -xzf "$archive_path" -C "$extract_directory"
          binary_path="$extract_directory/lark-cli"
          if [[ ! -f "$binary_path" || -L "$binary_path" ]]; then
            echo "Extracted lark-cli must be a regular non-symlink file at archive root." >&2
            exit 1
          fi

          codesign --verify --strict --verbose=4 "$binary_path"
          codesign_details="${RUNNER_TEMP}/codesign-details-${ARCH}.txt"
          codesign -dv --verbose=4 "$binary_path" 2> "$codesign_details"
          if ! grep -Eq '^Authority=Developer ID Application: .+' "$codesign_details"; then
            echo "Code signature does not contain a Developer ID Application authority." >&2
            exit 1
          fi
          if ! grep -Fxq "TeamIdentifier=${MACOS_TEAM_ID}" "$codesign_details"; then
            echo "Code signature TeamIdentifier does not match MACOS_TEAM_ID." >&2
            exit 1
          fi
          if ! grep -Fq 'flags=0x10000(runtime)' "$codesign_details"; then
            echo "Code signature does not enable the hardened runtime flag." >&2
            exit 1
          fi
          if ! grep -Eq '^Timestamp=.+$' "$codesign_details"; then
            echo "Code signature does not contain a nonempty secure timestamp." >&2
            exit 1
          fi

          spctl_details="${RUNNER_TEMP}/spctl-details-${ARCH}.txt"
          if ! spctl --assess --type execute --verbose=4 "$binary_path" \
            > "$spctl_details" 2>&1
          then
            cat "$spctl_details" >&2
            exit 1
          fi
          if ! grep -Eq '(^|: )[Aa]ccepted$' "$spctl_details"; then
            echo "Gatekeeper did not report the binary as accepted." >&2
            exit 1
          fi
          if ! grep -Fq 'source=Notarized Developer ID' "$spctl_details"; then
            echo "Gatekeeper did not report a Notarized Developer ID source." >&2
            exit 1
          fi

          version_output="$("$binary_path" --version)"
          VERSION_OUTPUT="$version_output" node <<'NODE'
          const { VERSION, VERSION_OUTPUT } = process.env;
          const tokens = VERSION_OUTPUT.split(/\s+/).filter(Boolean);
          if (!tokens.includes(VERSION)) {
            throw new Error(
              `lark-cli --version did not contain the exact version token ${VERSION}`,
            );
          }
          NODE
