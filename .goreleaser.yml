version: 2

builds:
  # Linux & Windows: pure-Go TPM 2.0 signer (sks_signer), cross-compiled with
  # CGO disabled — the binaries ship the platform key signer for private_key_jwt.
  - id: linux
    binary: lark-cli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=sks_signer
    ldflags:
      - -s -w -X github.com/larksuite/cli/internal/build.Version={{ .Version }} -X github.com/larksuite/cli/internal/build.Date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  # windows/amd64 carries the sks signer. windows/arm64 ships unsigned: the sks
  # dependency stack (certtostore -> go-ole) has no windows/arm64 support, so it
  # falls back to client_secret only (same as before this change).
  - id: windows
    binary: lark-cli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=sks_signer
    ldflags:
      - -s -w -X github.com/larksuite/cli/internal/build.Version={{ .Version }} -X github.com/larksuite/cli/internal/build.Date={{ .Date }}
    goos:
      - windows
    goarch:
      - amd64
  - id: windows-arm64
    binary: lark-cli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/larksuite/cli/internal/build.Version={{ .Version }} -X github.com/larksuite/cli/internal/build.Date={{ .Date }}
    goos:
      - windows
    goarch:
      - arm64
  # macOS: the keychain signer calls Security.framework via runtime FFI (purego),
  # so it is CGO-free, compiled into every darwin build (no build tag), and
  # cross-compiles from the same ubuntu runner as linux/windows.
  - id: darwin
    binary: lark-cli
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/larksuite/cli/internal/build.Version={{ .Version }} -X github.com/larksuite/cli/internal/build.Date={{ .Date }}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - darwin
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY_PATH }}"
        wait: true
        timeout: 20m

archives:
  - name_template: "lark-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
