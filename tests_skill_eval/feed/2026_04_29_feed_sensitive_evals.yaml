- case_id: lark_cli_2026_04_29_feed_sensitive_001
  query: "帮我给群 oc_abc123 里的用户 ou_user001 开启即时提醒，这样他们能第一时间看到这条消息"
  expectations: "AI 应该调用 feed +sensitive 命令，使用 --feed-card-id oc_abc123、--enable 和 --user-ids ou_user001。决策点：从「开启」意图推断使用 --enable 而非 --disable，以及从自然语言中提取 feed card ID 和 user ID 两个必填参数。"

- case_id: lark_cli_2026_04_29_feed_sensitive_002
  query: "这条群消息的即时提醒已经没必要了，帮我把 oc_gid456 里 ou_userA 的即时提醒关掉"
  expectations: "AI 应该调用 feed +sensitive 命令，使用 --feed-card-id oc_gid456、--disable 和 --user-ids ou_userA。决策点：从「关闭/取消」意图推断使用 --disable 而非 --enable，与 case_001 形成开启/关闭的对称决策边界。"

- case_id: lark_cli_2026_04_29_feed_sensitive_003
  query: "我有三个同事需要收到即时提醒：ou_user001、ou_user002 和 ou_user003，群的 feed card 是 oc_team789，帮我一次性全部开启"
  expectations: "AI 应该调用 feed +sensitive 命令，使用 --feed-card-id oc_team789、--enable，并将三个 user ID 以逗号分隔传给 --user-ids（如 --user-ids ou_user001,ou_user002,ou_user003）或使用重复 flag。决策点：从多个用户的场景推断 --user-ids 支持批量传入，而不是多次调用命令。"

- case_id: lark_cli_2026_04_29_feed_sensitive_004
  query: "我想用自己的飞书账号身份给群 oc_xyz000 的成员 ou_userB 开启即时提醒"
  expectations: "AI 应该识别 feed +sensitive 是 bot-only 命令，不支持个人用户 identity（user auth）。AI 应提示用户该命令仅支持应用（bot）身份，需要使用 Custom App 或 Store App 的 bot token，并说明所需权限 im:datasync.feed_card.time_sensitive:write。决策点：身份/权限决策，识别 bot-only 限制并引导用户使用正确的认证方式。"

- case_id: lark_cli_2026_04_29_feed_sensitive_005
  query: "这些用户的 ID 是 union_id 类型的：uid_alpha 和 uid_beta，帮我给他们在群 oc_grp111 里开启即时提醒"
  expectations: "AI 应该调用 feed +sensitive 命令，使用 --feed-card-id oc_grp111、--enable、--user-ids uid_alpha,uid_beta，并额外指定 --user-id-type union_id。决策点：从用户明确说明 ID 类型为 union_id 推断需要传入 --user-id-type 参数，而不是使用默认的 open_id 类型。"

- case_id: lark_cli_2026_04_29_feed_sensitive_006
  query: "我刚刚给 oc_grp222 的几个用户开启了即时提醒，结果有些人失败了，说有人不在群里，这是什么情况，接下来应该怎么处理？"
  expectations: "AI 应该解释 feed +sensitive 命令在部分用户操作失败时会返回 failed_user_reasons，其中包含每个失败用户的错误信息（如 'The user is not in the chat'）和对应的 user_id。AI 应建议用户确认失败用户是否确实是该群成员，并在用户加入群后重新对其单独执行命令。决策点：错误恢复场景，agent 需要解读 failed_user_reasons 响应结构并提供可操作的修复建议。"

- case_id: lark_cli_2026_04_29_feed_sensitive_007
  query: "我想在真正执行之前先看看给群 oc_grp333 的用户 ou_userC 开启即时提醒会发送什么请求，帮我预览一下"
  expectations: "AI 应该调用 feed +sensitive 命令，使用 --feed-card-id oc_grp333、--enable、--user-ids ou_userC，并加上预览/试运行参数，让命令打印将要发出的 PATCH 请求详情（包括路径和 body），而不实际调用 API。决策点：dry-run 参数推断，agent 需从「预览/不实际执行」意图识别出需要传入试运行 flag。"
